# Continuous integration for the API and the website it serves. The website
# lives in this repository at web/site (an npm workspace), so one checkout is
# enough: `npm ci` installs both, `npm run build` builds the website — image
# ladder included — and then the API. The admin panel is a separate
# repository deployed on its own subdomain; it is not built here, so /admin
# is not mounted and its e2e cases are skipped.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: typecheck, tests, build, budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laspace
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      NODE_ENV: development
      PORT: '4000'
      PUBLIC_ORIGIN: http://localhost:5173
      ADMIN_ORIGIN: http://localhost:5174
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: laspace
      DB_USERNAME: root
      DB_PASSWORD: root
      MEDIA_DRIVER: local
      MEDIA_LOCAL_PATH: ./storage
      CDN_BASE_URL: http://localhost:4000
      SITE_DIST: ./web/site/dist
      ADMIN_DIST: ./no-admin-build
    steps:
      - uses: actions/checkout@v4
        with:
          path: la_space_backend

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: la_space_backend/package-lock.json

      - name: Install, typecheck, unit tests
        working-directory: la_space_backend
        run: npm ci && npm run typecheck && npm test

      - name: Build (website image ladder and pages, then the API)
        working-directory: la_space_backend
        run: npm run build

      - name: Schema and seed (the seed reads web/site)
        working-directory: la_space_backend
        run: npm run migration:run && npm run seed

      - name: Entities and migrations agree
        working-directory: la_space_backend
        run: |
          npm run migration:generate -- CiDriftCheck || true
          test -z "$(git status --porcelain -- src/database/migrations)" || { echo "Entity changes without a migration:"; git status --porcelain -- src/database/migrations; exit 1; }

      - name: e2e against MySQL
        working-directory: la_space_backend
        run: npm run test:e2e

      - name: Lighthouse budget, mobile, against the API-served site
        working-directory: la_space_backend
        run: |
          node dist/main.js > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4000/health >/dev/null && break; sleep 1; done
          npm run -w web/site budget -- http://localhost:4000

      - name: API log on failure
        if: failure()
        working-directory: la_space_backend
        run: test -f api.log && tail -50 api.log || true
